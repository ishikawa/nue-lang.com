name: Deploy Site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Work around npm optional dependency bug (Rollup native)
        run: |
          ROLLUP_NATIVE_PKG='@rollup/rollup-linux-x64-gnu'
          if [ "$(uname -m)" = "aarch64" ]; then
            ROLLUP_NATIVE_PKG='@rollup/rollup-linux-arm64-gnu'
          fi
          npm install --no-save "$ROLLUP_NATIVE_PKG"

      - name: Resolve site base
        id: site_base
        run: |
          if [ -s public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_BASE: ${{ steps.site_base.outputs.value }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
