name: CI

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/**"

jobs:
  site:
    name: Site Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Work around npm optional dependency bug (Rollup native)
        run: |
          ROLLUP_NATIVE_PKG='@rollup/rollup-linux-x64-gnu'
          if [ "$(uname -m)" = "aarch64" ]; then
            ROLLUP_NATIVE_PKG='@rollup/rollup-linux-arm64-gnu'
          fi
          npm install --no-save "$ROLLUP_NATIVE_PKG"

      - name: Build (includes astro check)
        run: npm run build
