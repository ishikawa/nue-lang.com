name: CI

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/**"

jobs:
  site:
    name: Site Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes astro check)
        run: npm run build
